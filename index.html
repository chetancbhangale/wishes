<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' blob: data: https://*.supabase.co; connect-src https://*.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'">
  <title>Birthday wishes</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <div class="appbar-inner">
      <span class="avatar" id="appbar-avatar" aria-hidden="true"></span>
      <div class="appbar-title">
        <strong id="app-title">Birthday wishes</strong>
        <span id="appbar-sub">Birthday wishes</span>
      </div>
    </div>
  </header>

  <main class="app">
    <section class="hero-card">
      <img class="hero-photo" id="hero-photo" alt="" hidden>
      <span class="chip" id="today-chip" hidden></span>
      <h1>Happy birthday, <span class="name" id="hero-name"></span></h1>
      <p class="intro" id="intro"></p>

      <div class="countdown" id="countdown" hidden>
        <p class="countdown-label" id="countdown-label">Counting down to her birthday</p>
        <div class="tiles" role="timer" aria-live="off">
          <div class="tile days"><span id="cd-days">0</span><small>Days</small></div>
          <div class="tile"><span id="cd-hours">00</span><small>Hours</small></div>
          <div class="tile"><span id="cd-mins">00</span><small>Mins</small></div>
          <div class="tile"><span id="cd-secs">00</span><small>Secs</small></div>
        </div>
      </div>
      <div class="hero-meta">
        <span class="count" id="count"></span>
      </div>
    </section>

    <section class="note-card" id="note-card" aria-labelledby="note-title">
      <div class="note-head">
        <span class="avatar" id="note-avatar" aria-hidden="true"></span>
        <div>
          <strong id="note-title">A note for you</strong>
          <span id="note-sub"></span>
        </div>
      </div>
      <p class="note-text" id="note-text"></p>
      <p class="note-sign" id="note-sign" hidden></p>
    </section>

    <h2 class="section-title" id="wishes-title">Wishes</h2>
    <section id="wall" class="feed" aria-live="polite">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </section>
  </main>

  <div class="bottom-bar">
    <button class="btn primary block" id="open-compose" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      Write a wish
    </button>
  </div>

  <!-- Compose bottom sheet -->
  <dialog class="sheet" id="compose" aria-labelledby="add-title">
    <div class="sheet-head">
      <h2 id="add-title">Write a wish</h2>
      <button class="icon-btn" id="close-compose" type="button" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="sheet-body">
      <form id="wish-form" class="form-grid" novalidate>
        <div>
          <label for="name">Your name</label>
          <input id="name" type="text" maxlength="60" autocomplete="name" placeholder="e.g. Anita" required>
        </div>

        <div>
          <div class="row-between">
            <label for="message">Your message</label>
            <span class="hint"><span id="chars">0</span>/1500</span>
          </div>
          <textarea id="message" maxlength="1500" placeholder="A favourite memory, an inside joke, or what she means to you…" required></textarea>
        </div>

        <div>
          <span class="label">Photo <span class="hint">· optional</span></span>
          <label class="photo-drop" for="photo">
            <input id="photo" type="file" accept="image/*">
            <span class="tile" id="photo-tile">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
            </span>
            <span>
              <strong id="photo-label">Add a photo</strong>
              <span class="hint">Location data is removed automatically</span>
            </span>
          </label>
          <button id="clear-photo" type="button" class="btn ghost small" hidden>Remove photo</button>
        </div>

        <div id="code-field">
          <label for="code">Passcode</label>
          <input id="code" type="password" autocomplete="off" placeholder="From your invite" required>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
        <button id="submit" class="btn primary block" type="submit">Send wish</button>
      </form>

      <div id="sent" class="sent" hidden>
        <div class="icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        </div>
        <h3>Wish sent!</h3>
        <p>It will appear in the feed once it's approved.</p>
        <div class="btns">
          <button id="done" class="btn primary block" type="button">Done</button>
          <button id="another" class="btn ghost block" type="button">Write another</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="lightbox" id="lightbox">
    <img id="lightbox-img" alt="">
    <button class="btn small" id="lightbox-close" type="button">Close</button>
  </dialog>

  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
